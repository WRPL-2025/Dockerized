services:
  mariadb:
    image: bitnami/mariadb:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_DATABASE=bitnami_moodle
    volumes:
      - mariadb_data:/bitnami/mariadb

  moodle:
    build: .
    image: moodle-ipaymu
    ports:
      - "8081:8080"
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_DATABASE_USER=root
      - MOODLE_DATABASE_PASSWORD=
      - ALLOW_EMPTY_PASSWORD=yes
      - MOODLE_USERNAME=admin        # ← your chosen admin name
      - MOODLE_PASSWORD=Admin123!   # ← secure admin password (min 8 chars, include letters, numbers, symbols)
      - MOODLE_EMAIL=you@example.com # ← your email address
      - MOODLE_SITE_NAME=My Moodle Site # ← your site name
      - BITNAMI_DEBUG=true
    volumes:
      - moodle_data:/bitnami/moodle
      - apache_data:/bitnami/apache
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  moodle_data:
  apache_data:
